<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio style exploration (prototype)</title>
    <style>
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../../src/web/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../../src/web/fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        padding: 24px;
      }
      #stage {
        position: relative;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #stage .grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
        background-size: 12px 12px;
        background-position: -6px -6px;
        -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 55%, transparent 100%);
        mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 55%, transparent 100%);
      }
      #stage svg {
        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
      }
      #stage .label {
        font: 400 12px/1 "IBM Plex Mono", ui-monospace, monospace;
        letter-spacing: 0.02em;
      }
      #stage .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 6px;
        font: 400 12px/1.4 "IBM Plex Mono", ui-monospace, monospace;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
