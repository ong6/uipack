<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uipack playground</title>
    <!-- The uipack mark (src/marks), inline so the playground makes no favicon request. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3Eg{stroke:%23111;fill:none}.f{fill:%23111}@media(prefers-color-scheme:dark){g{stroke:%23eee}.f{fill:%23eee}}%3C/style%3E%3Cg stroke-width='2.5'%3E%3Crect x='4' y='4' width='10' height='10' rx='2'/%3E%3Crect x='18' y='4' width='10' height='10' rx='2'/%3E%3Crect x='4' y='18' width='10' height='10' rx='2'/%3E%3Crect class='f' x='18' y='18' width='10' height='10' rx='5'/%3E%3C/g%3E%3C/svg%3E"
    />
    <!-- The dev server is never indexed. A build writes one file per route (playground/site.ts): docs
         pages drop this line and get a canonical; /web, an illustrative product, and 404.html keep it. -->
    <meta name="robots" content="noindex" />
    <!-- The default for every route; /web replaces it with its own through useHead. -->
    <meta
      name="description"
      content="The uipack playground: React and SVG figures, charts, 3D animations, decks and web page blocks for engineering write-ups, each with its source."
    />
    <!-- Before the first paint, a blocking script sets the theme (the theme half of uipack
         styleBootScript, inlined; data-theme and data-ui-theme): ?theme=light|dark wins, then the
         reader's last choice (the toggle stores it under "uipack-theme"), then the system's
         prefers-color-scheme. The style is Technical, the one implemented style, set on <body> and
         on the shell's frame. vercel.json's Content-Security-Policy names this script by its hash:
         the site build fails, with the new hash, when it changes. -->
    <script>
      (function () {
        var d = document.documentElement,
          t = new URLSearchParams(location.search).get("theme");
        try {
          if (t !== "light" && t !== "dark") t = localStorage.getItem("uipack-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        d.setAttribute("data-theme", t);
        d.setAttribute("data-ui-theme", t);
      })();
    </script>
    <!-- /web: preload Technical's display face (uipack/web fontPreloads; uiStyles[].preload), IBM
         Plex Sans 600, the hero headline; text and labels swap in place over metric-matched
         fallbacks. Vite rewrites the href to the built file the CSS uses; media="not all" keeps it
         inert, and the script below turns it on for /web in a build, at 720px and wider: on a
         phone the swap moves nothing and the preload only slows the first paint. The dev server
         serves fonts from another URL, so it skips it. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="../src/web/fonts/ibm-plex-sans-latin-600-normal.woff2"
      media="not all"
      data-preload-web
    />
    <script>
      if (location.pathname.replace(/\/$/, "") === "/web") {
        for (const l of document.querySelectorAll("link[data-preload-web]")) {
          if (!l.getAttribute("href").startsWith("/assets/")) continue;
          const on = l.cloneNode();
          on.setAttribute("media", "(min-width: 720px)");
          on.removeAttribute("data-preload-web");
          l.after(on);
        }
      }
    </script>
  </head>
  <body data-ui-style="technical">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
