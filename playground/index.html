<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uipack playground</title>
    <!-- The uipack mark (src/marks), inline so the playground makes no favicon request. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3Eg{stroke:%23111;fill:none}.f{fill:%23111}@media(prefers-color-scheme:dark){g{stroke:%23eee}.f{fill:%23eee}}%3C/style%3E%3Cg stroke-width='2.5'%3E%3Crect x='4' y='4' width='10' height='10' rx='2'/%3E%3Crect x='18' y='4' width='10' height='10' rx='2'/%3E%3Crect x='4' y='18' width='10' height='10' rx='2'/%3E%3Crect class='f' x='18' y='18' width='10' height='10' rx='5'/%3E%3C/g%3E%3C/svg%3E"
    />
    <!-- An illustrative demo, client-rendered: never index it, even if deployed (docs/web-discoverability.md). -->
    <meta name="robots" content="noindex" />
    <!-- The default for every route; /web replaces it with its own through useHead. -->
    <meta
      name="description"
      content="The uipack playground: React and SVG figures, charts, 3D animations, decks and Landing-page blocks for engineering write-ups, each with its source."
    />
    <!-- Before the first paint, a blocking script sets the theme and the page's style from the URL
         (uipack styleBootScript, inlined): data-theme and data-ui-theme from ?theme=, data-ui-style
         from ?style=. The shell stays Technical (its frame sets data-ui-style="technical"); /web and
         the decks show their content in the chosen style, so it never flashes another one. -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search),
          d = document.documentElement;
        var t = q.get("theme") === "dark" ? "dark" : "light";
        d.setAttribute("data-theme", t);
        d.setAttribute("data-ui-theme", t);
        var s = q.get("style");
        if (["technical", "landing", "graphical"].indexOf(s) >= 0) d.setAttribute("data-ui-style", s);
      })();
    </script>
    <!-- /web: preload only the active style's display face (uipack/web fontPreloads; uiStyles[].preload).
         Technical preloads IBM Plex Sans 600 (its display weight, the hero headline; text and labels
         swap in place over metric-matched fallbacks). Landing preloads Instrument Serif (display + italic, the hero title has an <em>); Graphical
         preloads Anton. Vite rewrites each href to the built file the CSS uses; media="not all" keeps
         them inert, and the script below turns on the active style's set for /web in a build, at
         720px and wider: there the Landing swap re-wrapped the centred headline (CLS 0.042 at
         1440px), while on a phone it moved nothing and the preload only slowed the first paint.
         The dev server serves fonts from another URL, so it skips them. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="../src/web/fonts/ibm-plex-sans-latin-600-normal.woff2"
      media="not all"
      data-preload-style="technical"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="../src/web/fonts/instrument-serif-latin-400-normal.woff2"
      media="not all"
      data-preload-style="landing"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="../src/web/fonts/instrument-serif-latin-400-italic.woff2"
      media="not all"
      data-preload-style="landing"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="../src/web/fonts/anton-latin-400-normal.woff2"
      media="not all"
      data-preload-style="graphical"
    />
    <script>
      if (location.pathname.replace(/\/$/, "") === "/web") {
        var style = document.documentElement.getAttribute("data-ui-style") || "technical";
        for (const l of document.querySelectorAll('link[data-preload-style="' + style + '"]')) {
          if (!l.getAttribute("href").startsWith("/assets/")) continue;
          const on = l.cloneNode();
          on.setAttribute("media", "(min-width: 720px)");
          on.removeAttribute("data-preload-style");
          l.after(on);
        }
      }
    </script>
  </head>
  <body data-ui-style="technical">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
