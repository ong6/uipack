<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uipack playground</title>
    <!-- The uipack mark (src/marks), inline so the playground makes no favicon request. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3Eg{stroke:%23111;fill:none}.f{fill:%23111}@media(prefers-color-scheme:dark){g{stroke:%23eee}.f{fill:%23eee}}%3C/style%3E%3Cg stroke-width='2.5'%3E%3Crect x='4' y='4' width='10' height='10' rx='2'/%3E%3Crect x='18' y='4' width='10' height='10' rx='2'/%3E%3Crect x='4' y='18' width='10' height='10' rx='2'/%3E%3Crect class='f' x='18' y='18' width='10' height='10' rx='5'/%3E%3C/g%3E%3C/svg%3E" />
    <!-- An illustrative demo, client-rendered: never index it, even if deployed (docs/web-discoverability.md). -->
    <meta name="robots" content="noindex" />
    <!-- The default for every route; /web replaces it with its own through useHead. -->
    <meta name="description" content="The uipack playground: React and SVG figures, charts, 3D animations, decks and Landing-page blocks for engineering write-ups, each with its source." />
    <!-- /web: preload the Landing hero's display faces (uipack/web fontPreloads: display + italic,
         because the hero title has an <em>). Vite rewrites each href to the built file the CSS uses;
         media="not all" keeps them inert on every other route, and the script below turns them on
         for /web in a build, at 720px and wider: there the swap re-wrapped the centred headline
         (CLS 0.042 at 1440px), while on a phone it moved nothing and the preload only slowed the
         first paint. The dev server serves fonts from another URL, so it skips them. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="../src/web/fonts/instrument-serif-latin-400-normal.woff2" media="not all" data-preload-route="/web" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="../src/web/fonts/instrument-serif-latin-400-italic.woff2" media="not all" data-preload-route="/web" />
    <script>
      if (location.pathname.replace(/\/$/, "") === "/web")
        for (const l of document.querySelectorAll('link[data-preload-route="/web"]')) {
          if (!l.getAttribute("href").startsWith("/assets/")) continue;
          const on = l.cloneNode();
          on.setAttribute("media", "(min-width: 720px)");
          on.removeAttribute("data-preload-route");
          l.after(on);
        }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
