<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- CI only (.github/workflows/ci.yml copies this to ~/.config/fontconfig/fonts.conf).
     A bare Linux runner resolves system-ui and sans-serif to DejaVu Sans, about 10% wider than
     any face a visitor's device uses, so text-fit checks failed there and nowhere else. Roboto
     is the system face on Android, a real target, and close to San Francisco and Segoe UI. -->
<fontconfig>
  <alias binding="strong"><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
</fontconfig>
