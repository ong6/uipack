# Monthly version updates, one grouped pull request per ecosystem for minor and patch bumps.
# Major bumps are ignored for version updates (take them by hand, with their migration); an
# `update-types` ignore does not apply to security updates, so those still open as they arrive.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Leave a range alone while the new version satisfies it and raise it only when it does not, so
    # a peer range (three's `^0.187.0`) is never narrowed to the version just installed. A three
    # minor still changes what every site installs: review its migration notes and the 3D e2e.
    versioning-strategy: increase-if-necessary
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
