# Monthly version updates, one grouped pull request per ecosystem for minor and patch bumps.
# Major bumps are ignored for version updates (take them by hand, with their migration); an
# `update-types` ignore does not apply to security updates, so those still open as they arrive.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # three is a peer dependency (`^0.186.0`); a 0.x minor is breaking under caret, so a bump
      # changes what every site must install. Take it by hand with the peer range and 3D e2e.
      - dependency-name: "three"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/three"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
