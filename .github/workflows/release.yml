# Builds the package from a version tag and attaches the tarball to that tag's GitHub release as
# uipack-<version>.tgz, the file every site installs (docs/releases.md). dist/ is not committed, so
# this tarball is the only built copy of a release.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and upload, e.g. v0.4.0"
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: The tag names the package.json version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match package.json version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - run: npm test
      - name: Import every built entry and resolve every file export
        run: node scripts/load-entries.mjs
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pack
          test -f "uipack-$VERSION.tgz"
          tar -tzf "uipack-$VERSION.tgz" | grep -qx "package/dist/index.js" || { echo "dist/ missing from the tarball"; exit 1; }
      - name: Release notes from the CHANGELOG section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no ## [$VERSION] section"; exit 1; }
      - name: Create the release, or replace its tarball
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "uipack-$VERSION.tgz" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "uipack-$VERSION.tgz" --verify-tag --title "uipack $VERSION" --notes-file notes.md
          fi
