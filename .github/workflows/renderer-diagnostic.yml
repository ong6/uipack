name: renderer diagnostic
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0 mesa-utils
      - name: Run unchanged timing assertions without trace recording
        run: npx playwright test e2e/art-directions.spec.ts --project=chromium --workers=1 --retries=0 --trace=off --reporter=line,json --grep 'mobile geometry and paint budget\x3a (tennis/paper-theatre|reading/realistic|trading/abstract)|direction [12] loops'
        env:
          CI: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: renderer-assertions.json
      - name: Compare real renderers and tracing overhead
        if: always()
        run: |
          xvfb-run --auto-servernum node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { spawn } from 'node:child_process';
          import { cpus } from 'node:os';
          import { writeFileSync } from 'node:fs';
          const server = spawn(process.execPath, ['node_modules/vite/bin/vite.js', '--port', '5179', '--strictPort'], { stdio: ['ignore', 'ignore', 'inherit'] });
          const report = { cpu: cpus()[0].model, cores: cpus().length, samples: [] };
          const modes = [
            { name: 'shell', launch: {} },
            { name: 'shell-trace-filmstrip', launch: {}, trace: { screenshots: true, snapshots: true } },
            { name: 'shell-trace-no-filmstrip', launch: {}, trace: { screenshots: false, snapshots: true } },
            { name: 'full', launch: { channel: 'chromium' } },
            { name: 'full-mesa', launch: { channel: 'chromium', args: ['--use-angle=gl'] } },
            { name: 'shell-mesa', launch: { args: ['--use-angle=gl'] } },
          ];
          try {
            for (let attempt = 0; attempt < 80; attempt++) {
              if (await fetch('http://localhost:5179').then(r => r.ok).catch(() => false)) break;
              await new Promise(resolve => setTimeout(resolve, 250));
            }
            for (const mode of modes) {
              const browser = await chromium.launch(mode.launch);
              try {
                for (const [kind, variant] of [['tennis', 1], ['reading', 4], ['trading', 5]]) {
                  const context = await browser.newContext({ viewport: { width: 390, height: 900 } });
                  const started = Date.now();
                  try {
                    if (mode.trace) await context.tracing.start(mode.trace);
                    const page = await context.newPage();
                    await page.goto(`http://localhost:5179/animations?story=${kind}&variant=${variant}`, { timeout: 15000 });
                    const canvas = page.locator('.uipack-object canvas');
                    await canvas.scrollIntoViewIfNeeded();
                    await page.waitForFunction(() => document.querySelector('.uipack-object canvas')?.dataset.renderer, null, { timeout: 15000 });
                    await page.waitForFunction(() => Number(document.querySelector('.uipack-object canvas')?.dataset.frames) > 3, null, { timeout: 5000 });
                    const sample = await canvas.evaluate(async canvas => {
                      const gl = canvas.getContext('webgl2');
                      const debug = gl.getExtension('WEBGL_debug_renderer_info');
                      const renderer = gl.getParameter(debug ? debug.UNMASKED_RENDERER_WEBGL : gl.RENDERER);
                      const first = Number(canvas.dataset.frames), started = performance.now();
                      await new Promise(resolve => setTimeout(resolve, 2000));
                      const elapsed = performance.now() - started, frames = Number(canvas.dataset.frames) - first;
                      return { renderer, elapsed, frames, fps: frames * 1000 / elapsed, calls: Number(canvas.dataset.drawCalls), triangles: Number(canvas.dataset.triangles) };
                    });
                    const result = { mode: mode.name, kind, variant, duration: Date.now() - started, ...sample };
                    report.samples.push(result);
                    console.log(JSON.stringify(result));
                  } catch (error) {
                    const result = { mode: mode.name, kind, variant, error: error.message };
                    report.samples.push(result);
                    console.log(JSON.stringify(result));
                  } finally {
                    await context.close();
                    writeFileSync('renderer-diagnostic.json', JSON.stringify(report, null, 2));
                  }
                }
              } finally { await browser.close(); }
            }
          } finally { server.kill(); }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-diagnostic
          path: |
            renderer-diagnostic.json
            renderer-assertions.json
            test-results/
          retention-days: 7
