name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install Mesa for Chromium
        if: matrix.browser == 'chromium'
        run: sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0
      - name: Test Chromium with Mesa
        if: matrix.browser == 'chromium'
        run: xvfb-run --auto-servernum npm run test:e2e -- --project=chromium --shard=${{ matrix.shard }}/4
        env: { CI: "1" }
      - name: Test WebKit
        if: matrix.browser == 'webkit'
        run: npm run test:e2e -- --project=webkit --shard=${{ matrix.shard }}/4
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
