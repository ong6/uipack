name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # dist/ is not committed: build it before anything that reads it (the typecheck of
      # playground/dist-smoke, the unit tests, the entry loader, attw).
      - name: Build dist/
        run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Docs generated blocks and llms.txt are current (npm run docs:sync)
        run: npm run docs:sync -- --check
      - name: Import every built entry and resolve every file export
        run: node scripts/load-entries.mjs
      - name: Types resolve under node16 and bundler (attw, esm-only profile)
        run: npm run attw
  react-majors:
    # The registry's sites span React 18 and 19 (junxiong.dev, the blog). dist/ is built on the locked
    # React 18, as a release is; then the matrix's major replaces it and scripts/react-majors.tsx
    # typechecks, bundles and renders the consumers (examples/web-starter, playground/dist-smoke)
    # against it, so a change that breaks either major fails here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build dist/
        run: npm run build
      - name: Install React ${{ matrix.react }}
        run: npm install --no-save --no-audit --no-fund react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - name: Typecheck, bundle and render the consumers on React ${{ matrix.react }}
        run: npx tsx scripts/react-majors.tsx ${{ matrix.react }}
  site:
    # The static docs site Vercel deploys from main (vercel.json): build it and crawl it with the
    # same headers, so a broken deploy, a CSP violation or a dead link fails the pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the docs site
        run: npm run build:site
      - name: Read installed Playwright version and runner image
        id: playwright
        run: |
          node -p "'version=' + require('./node_modules/@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}
      # scripts/ci-apt.sh explains the deb cache. A new runner image saves a fresh copy; the
      # restore key starts it from the last one, so apt fetches only what changed.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: apt
        with:
          path: ~/.cache/apt-debs
          key: apt-site-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
          restore-keys: apt-site-
      - name: Install browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install system dependencies and Mesa
        timeout-minutes: 10
        run: scripts/ci-apt.sh bash -c 'npx playwright install-deps chromium && sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0'
      # Saved straight after the install, so a later test failure still keeps the debs. An install
      # that timed out saves what it fetched under a partial key, which the next run restores.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.apt.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/apt-debs
          key: apt-site-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: (failure() || cancelled()) && steps.apt.outcome == 'success' && steps.apt.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/apt-debs
          key: apt-site-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Crawl every route with vercel.json's headers
        run: xvfb-run --auto-servernum npm run check:site -- --theme ${{ matrix.theme }}
        env: { CI: "1" }
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Software WebGL stays serial; the remaining Chromium specs share two parallel shards.
      # WebKit keeps its @cross-browser subset on one runner.
      matrix:
        include:
          - { browser: chromium, group: gl, shard: 1, shards: 2, workers: 1 }
          - { browser: chromium, group: gl, shard: 2, shards: 2, workers: 1 }
          - { browser: chromium, group: non-gl, shard: 1, shards: 2, workers: 2 }
          - { browser: chromium, group: non-gl, shard: 2, shards: 2, workers: 2 }
          - { browser: webkit, group: smoke, shard: 1, shards: 1 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # e2e/dist-smoke.spec.ts serves playground/dist-smoke, which imports the built dist/.
      - name: Build dist/
        run: npm run build
      - name: Read installed Playwright version and runner image
        id: playwright
        run: |
          node -p "'version=' + require('./node_modules/@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      # scripts/ci-apt.sh explains the deb cache. A new runner image saves a fresh copy; the
      # restore key starts it from the last one, so apt fetches only what changed.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: apt
        with:
          path: ~/.cache/apt-debs
          key: apt-e2e-${{ matrix.browser }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
          restore-keys: apt-e2e-${{ matrix.browser }}-
      - name: Install browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}
      - name: Install system dependencies, Roboto and (Chromium) Mesa
        timeout-minutes: 10
        run: scripts/ci-apt.sh bash -c 'npx playwright install-deps ${{ matrix.browser }} && sudo apt-get install -y fonts-roboto ${{ matrix.browser == 'chromium' && 'xvfb libgl1-mesa-dri libegl-mesa0' || '' }}'
      # Saved straight after the install, so a later test failure still keeps the debs. An install
      # that timed out saves what it fetched under a partial key, which the next run restores.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.apt.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/apt-debs
          key: apt-e2e-${{ matrix.browser }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: (failure() || cancelled()) && steps.apt.outcome == 'success' && steps.apt.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/apt-debs
          key: apt-e2e-${{ matrix.browser }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check Chromium spec coverage
        if: matrix.browser == 'chromium'
        run: node scripts/check-e2e-shards.mjs
      - name: Map the system font to Roboto (e2e/ci-fonts.conf explains why)
        run: |
          mkdir -p ~/.config/fontconfig && cp e2e/ci-fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f && fc-match system-ui
      - name: Test Chromium with Mesa
        if: matrix.browser == 'chromium'
        run: xvfb-run --auto-servernum npm run test:e2e -- $(node scripts/check-e2e-shards.mjs --group ${{ matrix.group }}) --project=chromium --workers=${{ matrix.workers }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env: { CI: "1" }
      - name: Test WebKit
        if: matrix.browser == 'webkit'
        run: npm run test:e2e -- --project=webkit --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env: { CI: "1" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.group }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
