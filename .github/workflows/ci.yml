name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Docs generated blocks and llms.txt are current (npm run docs:sync)
        run: npm run docs:sync -- --check
      - run: npm run build
      - name: dist is committed as built
        run: |
          git diff --exit-code --stat dist
          test -z "$(git status --porcelain dist)" || { git status --porcelain dist; echo "Rebuild and commit dist/"; exit 1; }
      - name: Load every built entry with import and require
        run: node scripts/load-entries.mjs
      - name: Types resolve for import and require (attw)
        run: npm run attw
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Chromium runs the whole suite in three shards; WebKit runs the @cross-browser subset
      # (playwright.config.ts) on one runner.
      matrix:
        include:
          - { browser: chromium, shard: 1, shards: 3 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Map the system font to Roboto (e2e/ci-fonts.conf explains why)
        run: |
          sudo apt-get install -y fonts-roboto
          mkdir -p ~/.config/fontconfig && cp e2e/ci-fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f && fc-match system-ui
      - name: Install Mesa for Chromium
        if: matrix.browser == 'chromium'
        run: sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0
      - name: Test Chromium with Mesa
        if: matrix.browser == 'chromium'
        run: xvfb-run --auto-servernum npx playwright test e2e/zz-probe.spec.ts --project=chromium --reporter=list
        env: { CI: "1" }
      - name: Test WebKit
        if: matrix.browser == 'webkit'
        run: npm run test:e2e -- --project=webkit --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
