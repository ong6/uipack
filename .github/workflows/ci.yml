name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Docs generated blocks and llms.txt are current (npm run docs:sync)
        run: npm run docs:sync -- --check
      - run: npm run build
      - name: dist is committed as built
        run: |
          git diff --exit-code --stat dist
          test -z "$(git status --porcelain dist)" || { git status --porcelain dist; echo "Rebuild and commit dist/"; exit 1; }
      - name: Load every built entry with import and require
        run: node scripts/load-entries.mjs
      - name: Types resolve for import and require (attw)
        run: npm run attw
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Software WebGL stays serial; the remaining Chromium specs share two parallel shards.
      # WebKit keeps its @cross-browser subset on one runner.
      matrix:
        include:
          - { browser: chromium, group: gl, shard: 1, shards: 2, workers: 1 }
          - { browser: chromium, group: gl, shard: 2, shards: 2, workers: 1 }
          - { browser: chromium, group: non-gl, shard: 1, shards: 2, workers: 2 }
          - { browser: chromium, group: non-gl, shard: 2, shards: 2, workers: 2 }
          - { browser: webkit, group: smoke, shard: 1, shards: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Read installed Playwright version
        id: playwright
        run: node -p "'version=' + require('./node_modules/@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install browser and system dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install system dependencies for cached browser
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Check Chromium spec coverage
        if: matrix.browser == 'chromium'
        run: node scripts/check-e2e-shards.mjs
      - name: Map the system font to Roboto (e2e/ci-fonts.conf explains why)
        run: |
          sudo apt-get install -y fonts-roboto
          mkdir -p ~/.config/fontconfig && cp e2e/ci-fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f && fc-match system-ui
      - name: Install Mesa for Chromium
        if: matrix.browser == 'chromium'
        run: sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0
      - name: Test Chromium with Mesa
        if: matrix.browser == 'chromium'
        run: xvfb-run --auto-servernum npm run test:e2e -- $(node scripts/check-e2e-shards.mjs --group ${{ matrix.group }}) --project=chromium --workers=${{ matrix.workers }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env: { CI: "1" }
      - name: Test WebKit
        if: matrix.browser == 'webkit'
        run: npm run test:e2e -- --project=webkit --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.group }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
